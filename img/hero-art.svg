      <rect x="890" y="155" width="18" height="22"/><rect x="918" y="155" width="18" height="22"/>
      <rect x="890" y="190" width="18" height="22"/><rect x="918" y="190" width="18" height="22"/>
      <rect x="890" y="225" width="18" height="22"/><rect x="918" y="225" width="18" height="22"/>
      <rect x="890" y="260" width="18" height="22"/><rect x="918" y="260" width="18" height="22"/>
      <rect x="890" y="295" width="18" height="22"/><rect x="918" y="295" width="18" height="22"/>
      <rect x="890" y="330" width="18" height="22"/><rect x="918" y="330" width="18" height="22"/>
    </g>
  </g>
  <!-- low office -->
  <path d="M1260 420 L1520 420 L1520 280 L1260 280 Z" fill="#1c2420" stroke="#c4a056" stroke-opacity="0.28"/>
  <g fill="#e8c97a" opacity="0.7">

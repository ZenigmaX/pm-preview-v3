    <rect x="240" y="320" width="28" height="36" opacity="0.45"/><rect x="285" y="320" width="28" height="36" opacity="0.75"/>
    <rect x="350" y="260" width="28" height="36" opacity="0.7"/><rect x="395" y="260" width="28" height="36" opacity="0.35"/>
    <rect x="350" y="320" width="28" height="36" opacity="0.6"/><rect x="395" y="320" width="28" height="36" opacity="0.85"/>
  </g>
  <!-- mid-rise -->
  <path d="M860 420 L1180 420 L1180 90 L860 90 Z" fill="#181f1d" stroke="#c4a056" stroke-opacity="0.3"/>

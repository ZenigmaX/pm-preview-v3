<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylized GTA property lot at dusk, placeholder art, not a photograph">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a18"/>
      <stop offset="55%" stop-color="#1a2420"/>
      <stop offset="100%" stop-color="#2a261c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4a056" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c4a056" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lot" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 39.5h40M39.5 0v40" stroke="#c4a056" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect x="0" y="420" width="1600" height="480" fill="url(#lot)"/>
  <rect x="0" y="420" width="1600" height="480" fill="url(#glow)"/>
  <!-- plaza mass -->
  <path d="M120 420 L520 420 L520 230 L120 230 Z" fill="#1c2622" stroke="#c4a056" stroke-opacity="0.35"/>
  <path d="M520 230 L700 180 L700 380 L520 420 Z" fill="#161d1b" stroke="#c4a056" stroke-opacity="0.25"/>
  <!-- windows -->
  <g fill="#e8c97a">
    <rect x="150" y="260" width="28" height="36" opacity="0.85"/><rect x="195" y="260" width="28" height="36" opacity="0.55"/>
    <rect x="240" y="260" width="28" height="36" opacity="0.8"/><rect x="285" y="260" width="28" height="36" opacity="0.4"/>

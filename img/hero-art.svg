  <!-- warm ground wash -->
  <ellipse cx="400" cy="520" rx="280" ry="40" fill="#c4a056" opacity="0.08"/>
  <ellipse cx="1020" cy="500" rx="220" ry="30" fill="#c4a056" opacity="0.1"/>

    <g opacity="0.75">
      <rect x="890" y="120" width="18" height="22"/><rect x="918" y="120" width="18" height="22"/><rect x="946" y="120" width="18" height="22"/>
      <rect x="890" y="155" width="18" height="22"/><rect x="918" y="155" width="18" height="22"/><rect x="946" y="155" width="18" height="22"/>
      <rect x="890" y="190" width="18" height="22"/><rect x="918" y="190" width="18" height="22"/><rect x="946" y="190" width="18" height="22"/>
      <rect x="890" y="225" width="18" height="22"/><rect x="918" y="225" width="18" height="22"/><rect x="946" y="225" width="18" height="22"/>
      <rect x="890" y="260" width="18" height="22"/><rect x="918" y="260" width="18" height="22"/><rect x="946" y="260" width="18" height="22"/>
      <rect x="890" y="295" width="18" height="22"/><rect x="918" y="295" width="18" height="22"/><rect x="946" y="295" width="18" height="22"/>
      <rect x="890" y="330" width="18" height="22"/><rect x="918" y="330" width="18" height="22"/><rect x="946" y="330" width="18" height="22"/>
